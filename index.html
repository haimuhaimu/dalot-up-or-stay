    <script>
      const scenarios = [
        ["overlap","12'","曼联 0-0 布莱顿","高位压迫型","4-2-3-1","右肋部，B费刚接到二点球","右半空间，面向前场","贴边拉宽，吸住对方左后卫","良好","回防积极但转身慢","中","套边太早会把传球线路带死","曼联完成一次反抢，布莱顿左路防线还没完全落位。右边锋保持宽度，B费抬头观察，但身前没有直接纵向传球口。",[["延迟套边",94,true,"先停在 B费外侧身后半步，等右边锋牵制住左后卫再突然加速，能同时打开下底和倒三角线路。",[28,18,27,21]],["高速套边",78,false,"推进意图很清楚，但启动过早会让对手提前退防，B费的持球角度反而被压缩。",[27,12,18,21]],["内收接应",66,false,"能帮中路稳住球权，但此刻右边已经形成局部人数优势，内收会错过边路突破窗口。",[14,20,16,16]],["留后防反击",58,false,"安全性不错，但后腰保护到位，完全不上会让曼联少一个能改变纵深的跑动点。",[8,27,11,12]]]],
        ["defense","27'","曼联 1-0 纽卡斯尔","快速转换型","4-2-3-1","对方左边锋在边线附近持球","前场中路，来不及回收","刚丢球，身后追防","不足","爆发力强，喜欢内切打远角","大","被一步过掉后中卫必须横移，禁区弧顶会空","曼联右路进攻丢球，对手立刻把球交到左边锋脚下。你身后空间很大，后腰还在回追路上。",[["放外线防内切",96,true,"对方最强武器是内切射门。你要用身体角度封住内线，宁愿让他走外线传中，也别让中路被打穿。",[4,34,30,28]],["前压逼抢",44,false,"后腰保护不足时贸然上抢，一旦被趟过就是清晰的禁区前沿机会。",[8,9,10,17]],["保持距离延缓",86,false,"这是可接受选择，能等队友回位；但如果不给出明确的防内切身体方向，对手仍会获得强侧脚机会。",[3,29,25,29]],["战术犯规",62,false,"可以阻断转换，但位置还靠边，优先用站位解决，不必过早吃牌。",[1,25,20,16]]]],
        ["invert","34'","曼联 0-1 阿森纳","中路压迫型","4-3-3","中卫右侧持球，被迫横传","前腰线，被后腰盯住","站在边线，准备接脚下球","一般","站位偏高，切断回传中卫线路","小","后场出球被锁在边线","阿森纳压迫触发点很清楚：球到右中卫就封边线。边路没有纵深空间，但中路六号位旁边出现短暂接应空当。",[["内收接应",98,true,"内收成临时中场，能给右中卫一个向内的传球角度，并帮助曼联绕开对方边线压迫陷阱。",[22,24,30,22]],["高速套边",39,false,"身后空间小、边路被锁死，此时套边更像主动跑进死胡同。",[11,8,7,13]],["留后防反击",63,false,"能保守站住位置，但解决不了出球角度问题，压力会继续留在右中卫身上。",[8,25,13,17]],["倒三角接应",75,false,"如果队友能第一时间做墙，这是不错的保险选择；但最优解仍是更主动地内收到中场线。",[17,21,18,19]]]],
        ["transition","41'","曼联 1-1 热刺","反击冲刺型","4-2-3-1","曼联左路传中被解围，球落到禁区前","禁区弧顶抢二点","远端禁区内等二点","不足","速度极快，已经在你身后启动","大","远端丢二点后被直接打身后","这是最容易上头的瞬间：你看到禁区外有二点球机会，但身后已经有人准备冲刺，后腰位置又空。",[["留后防反击",97,true,"远端边后卫必须读到反击链条。你留在中线附近能切断第一脚斜长传，防止整条防线被拉开。",[7,35,29,26]],["前压逼抢",52,false,"如果抢不到第一下，身后就是大片草地。后腰保护差时，这个风险太高。",[17,9,8,18]],["延迟套边",46,false,"曼联进攻已经到收尾阶段，这时套边参与价值很低，防反责任更重要。",[12,10,8,16]],["呼叫协防",80,false,"沟通是必要的，但不能只喊不动。你自己也要先占住防反击线路。",[5,27,23,25]]]],
        ["overlap","53'","曼联 0-0 埃弗顿","低位密集型","4-2-3-1","右边锋背身接球，边线附近","右肋部等待撞墙","被左后卫贴身，无法转身","良好","回收到禁区边，注意力在球","小","没有第三人跑动，右路会被困死","对手阵型压得很低，边路一对一没有空间。B费在肋部可以做墙，右边锋需要你带走防守者。",[["倒三角接应",92,true,"低位防守前，盲目下底不如占住倒三角位置。你能给边锋回做出口，也能接 B费的短传再传中。",[27,18,25,22]],["高速套边",73,false,"能制造拉扯，但身后空间小、对方落位完整，下底质量未必高。",[25,12,16,20]],["留后防反击",55,false,"太保守了。后腰保护不错，面对低位防守需要边后卫提供第三人接应。",[7,27,9,12]],["前压逼抢",42,false,"曼联现在是控球方，不存在立刻逼抢的触发条件。",[9,11,8,14]]]],
        ["defense","61'","曼联 2-1 切尔西","边路爆点型","4-4-2 防守落位","对方左边锋接到斜传，正面对你","回到中路第二线","已经回收到你身前五米","一般","右脚将，喜欢先外拨再内切","中","过早下脚被变向穿裆","你和右边锋已经形成二防一，但对手边锋脚下节奏好。禁区内有中锋等待传中，弧顶也有人包抄。",[["保持距离延缓",93,true,"二防一时别急着赌博。你负责控制内线和节奏，让右边锋从外侧施压，逼对手把球交回去。",[3,32,28,30]],["前压逼抢",57,false,"有协防时可以施压，但正面对爆点边锋直接扑，会给他变向攻击身后的机会。",[7,18,12,20]],["放外线防内切",85,false,"方向正确，但还需要配合右边锋的外侧夹击，单纯放外线会让传中压力变大。",[2,29,25,29]],["战术犯规",48,false,"局面还在可控范围，没必要送定位球。",[1,18,15,14]]]],
        ["invert","68'","曼联 1-1 西汉姆","双前锋压迫型","3-2-5 控球结构","奥纳纳短传到右中卫","前腰线偏左，牵制对方后腰","高位贴边，压住左翼卫","良好","站位偏内，想抢断后直塞","中","第一线出不来，被迫大脚失去球权","曼联想从后场短传推进。右边锋已经把宽度拉满，你身前的内侧通道短暂打开，卡塞米罗被对方前锋影子覆盖。",[["内收接应",95,true,"你内收到后腰旁边，能形成双枢纽出球点。这样右中卫不用冒险直传边线，也保留转移到弱侧的可能。",[23,25,25,22]],["高速套边",51,false,"边锋已经占宽，你再外走会造成同线重叠，反而减少一个中路接应点。",[13,13,9,16]],["留后防反击",74,false,"能保持三后卫保险，但当前更需要你向中场线移动，帮助第一线出球。",[11,29,16,18]],["呼叫协防",60,false,"沟通有帮助，但这个局面不是防守协防问题，而是出球结构需要你补位。",[9,20,14,17]]]],
        ["transition","74'","曼联 2-2 利物浦","高压反抢型","4-2-3-1","右路刚抢回球，球在你脚下","中路前插，示意要斜传","身前启动，准备冲身后","一般","反抢凶，身后留下空当","大","第一脚处理慢会被围抢","你抢断成功后有两秒窗口。对方边锋还在你身边反抢，但他们左后卫站位很高，右路纵深空间巨大。",[["延迟套边",96,true,"先把球交给右边锋攻击身后，再从内侧延迟跟进。这样既利用纵深，也保留倒三角二次接应。",[32,16,27,21]],["高速套边",88,false,"你可以带一步冲出去，但最佳处理是更早把球送到右边锋身前，让他攻击最大空间。",[30,12,24,22]],["内收接应",69,false,"能躲开反抢，但会放慢一次很好的转换机会。",[14,23,15,17]],["战术犯规",25,false,"你已经抢到球了，犯规会把一次进攻窗口白白送掉。",[0,10,5,10]]]],

      function renderReview() {
        const s = scenarios[current];
        const best = s.options.find(o => o.isBest) || selected;
        app.innerHTML = `
          <main class="screen review">
            <section class="review-head"><p class="eyebrow">复盘</p><h1>${selected.score}</h1><span>本题得分 / 100</span></section>
            <section class="grid2">
              <article class="section"><h2>你的选择</h2><p class="choice">${selected.label}</p></article>
              <article class="section"><h2>最佳选择</h2><p class="choice">${best.label}</p></article>
            </section>
            <section class="section"><h2>战术解释</h2><p>${selected.explanation}</p><h2>教练组复盘</h2><p>${coachReview(s, selected, best)}</p><div class="coach-notes"><span>扫描重点：${scanCue(s)}</span><span>触发条件：${triggerCue(s, best)}</span></div></section>
            <section class="section dims">${dimHtml(selected)}</section>
            <button class="primary" data-action="next">${current === scenarios.length - 1 ? "查看总结" : "下一题"}</button>
          </main>`;
      }

      function coachReview(s, selectedOption, bestOption) {
        if (selectedOption.isBest) return `这次判断很干净。你先读到了“${s.mainRisk}”，再根据 B费、右边锋和后腰保护的位置决定行动，像职业边后卫该有的先扫描、再启动。`;
        return `这个选择有一定道理，但你的第一眼没有抓住“${s.mainRisk}”。如果换成“${bestOption.label}”，你能更好地平衡推进、身后空间和队友协同。`;
      }

      function scanCue(s) {
        if (s.midfieldCover === "不足" || s.spaceBehind === "大") return "先看后腰保护和身后空间，再决定能不能前插。";
        if (s.mode === "invert") return "先看中卫出球角度和六号位旁边的接应口。";
        if (s.mode === "overlap") return "先看右边锋是否带走左后卫，以及 B费是否有传球角度。";
        return "先看对方边锋强脚方向和协防是否已经到位。";
      }

      function triggerCue(s, bestOption) {
        const riskCue = s.spaceBehind === "大" ? "身后空间大" : `主要风险是${s.mainRisk}`;
        return `${riskCue}时，优先考虑“${bestOption.label}”。`;
      }

      function renderSummary() {
        const total = selections.reduce((sum, o) => sum + o.score, 0);
        const avg = Math.round(total / selections.length);
        const dims = totals();
        const profile = getProfile(dims, avg);
        const issues = getIssues(dims, selections);
        app.innerHTML = `
          <main class="screen summary">
            <section class="summary-head"><p class="eyebrow">训练完成</p><h1>${total}</h1><p>总分</p><div class="avg">平均分：${avg}</div></section>
            <section class="section"><h2>玩家边后卫风格画像</h2><article class="profile"><strong>${profile.title}</strong><p>${profile.desc}</p></article></section>
            <section class="section"><h2>四维表现</h2><div class="dim-summary"><span>进攻推进 ${dims.attack}</span><span>防守安全 ${dims.defense}</span><span>空间理解 ${dims.space}</span><span>团队协同 ${dims.teamwork}</span></div></section>
            <section class="section"><h2>常见问题</h2><ul>${issues.map(i => `<li>${i}</li>`).join("")}</ul></section>
            <section class="section"><h2>下一轮训练建议</h2><p>${profile.advice}</p></section>

      function dimHtml(option) {
        const labels = { attack: "进攻推进", defense: "防守安全", space: "空间理解", teamwork: "团队协同" };
        return Object.entries(option.impact).map(([k,v]) => `
          <div><div class="dim-label"><span>${labels[k]}</span><strong>+${v}</strong></div><div class="meter"><span style="width:${Math.min(100, v * 3)}%"></span></div></div>
        `).join("");
      }

      function totals() {
        return selections.reduce((sum, o) => ({
          attack: sum.attack + o.impact.attack,
          defense: sum.defense + o.impact.defense,
          space: sum.space + o.impact.space,
          teamwork: sum.teamwork + o.impact.teamwork
        }), { attack: 0, defense: 0, space: 0, teamwork: 0 });
      }

      function getProfile(d, avg) {
        if (d.attack > d.defense + 35) return { title: "莽夫型达洛特", desc: "喜欢前插和上抢，冲击力强，但有时会把身后空间留给对手。", advice: "重点训练防反击识别：每次前插前先问自己，后腰保护是否到位，身后空间是否可控。" };
        if (d.defense > d.attack + 45) return { title: "稳健型达洛特", desc: "防守选择保守，安全性高，但进攻参与和第三人跑动还可以更主动。", advice: "重点训练套边时机：当右边锋内收、B费抬头、后腰保护到位时，要敢于提供纵深。" };
        if (d.space >= d.attack && d.space >= d.defense) return { title: "内收大师", desc: "擅长保护中路和帮助出球，能读懂队友站位之间的隐藏线路。", advice: "继续强化中路接应，同时练习从内收到外插的二次启动，让对手更难判断你的路线。" };
        if (avg >= 86 && d.attack >= d.defense - 10) return { title: "右路发动机", desc: "进攻参与积极，套边时机好，也知道什么时候该把球权交给队友提速。", advice: "下一轮可以提高难度，专门训练比赛末段的风险收益判断。" };
        return { title: "防反击专家", desc: "能识别危险，优先保护身后空间，在领先和转换阶段很可靠。", advice: "保持防守预判优势，再补一些低位进攻里的倒三角和延迟套边选择。" };
      }

      function getIssues(d, list) {
        const issues = [];
        if (list.filter(o => o.score < 70).length >= 3) issues.push("低分选择偏多，说明你在局面触发点上还需要更快识别主风险。");
        if (d.attack < 150) issues.push("进攻推进偏少，面对低位防守时可以更主动提供第三人接应。");
        if (d.defense < 190) issues.push("防守安全值偏低，前插前要先确认后腰保护和身后空间。");
        if (d.teamwork < 190) issues.push("团队协同还有提升空间，边后卫决策经常取决于 B费和右边锋的位置。");
        return issues.length ? issues : ["整体选择均衡，没有明显短板，下一步可以提高决策速度。"];
      }

      function modeName(mode) {
        return { defense: "防守 1v1", overlap: "套边时机", invert: "内收接应", transition: "防反击" }[mode];
      }

      app.addEventListener("click", (event) => {
        const target = event.target.closest("button");
        if (!target) return;
        if (target.dataset.action === "start") {
          state = "question"; current = 0; selected = null; selections = []; render(); return;
        }
        if (target.dataset.action === "next") {
          if (current === scenarios.length - 1) state = "summary";
          else { current += 1; state = "question"; selected = null; }
          render(); return;
        }
        if (target.dataset.option) {
          selected = scenarios[current].options.find(o => o.id === target.dataset.option);
          selections.push(selected);
          state = "review";
          render();
        }
      });

      render();
    </script>
  </body>
</html>
